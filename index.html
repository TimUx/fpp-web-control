<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{SITE_NAME}}</title>
  <meta name="description" content="{{SITE_DESCRIPTION}}">
  <meta name="theme-color" content="#170d19">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{SITE_NAME}}">
  <meta property="og:description" content="{{SITE_DESCRIPTION}}">
{{OG_IMAGE}}  <link rel="stylesheet" href="styles.css">
</head>
<body class="festive">
  <div class="scene-decor" aria-hidden="true">
    <div class="tree"></div>
    <div class="ornament ornament-star star-bright"></div>
    <div class="ornament ornament-star star-soft"></div>
    <div class="ornament ornament-star star-twinkle"></div>
    <div class="snowflake snowflake-main"></div>
    <div class="snowflake snowflake-mid"></div>
    <div class="snowflake snowflake-small"></div>
  </div>
  <div class="card">
    <header>
      <h1 id="headline"></h1>
      <details class="site-info" id="site-info">
        <summary>Zeiten &amp; Adresse</summary>
        <p class="subtitle" id="subtitle"></p>
      </details>
      <div class="countdown" id="countdown" role="timer" aria-live="off">Nächste Show wird berechnet …</div>
    </header>

    <div class="access-gate" id="access-gate">
      <p class="note" id="access-note">Bitte Zugangscode eingeben, um die Steuerung zu öffnen.</p>
      <input id="access-input" class="code-input" type="password" placeholder="Zugangscode" aria-label="Zugangscode">
      <button class="action btn-show" id="access-submit">Weiter</button>
      <p class="note" id="access-hint" role="status"></p>
      <p class="note error" id="access-error" role="alert"></p>
    </div>

    <div id="main-content" class="hidden">
      <p class="quiet-banner hidden" id="preview-banner" role="status"></p>
      <p class="quiet-banner hidden" id="scheduled-show-banner" role="status"></p>
      <p class="quiet-banner hidden" id="show-running-banner" role="status"></p>
      <p class="quiet-banner hidden" id="quiet-banner" role="status"></p>
      <p class="quiet-banner hidden" id="outside-window-banner" role="status"></p>
      <div class="status" id="status">
        <span class="indicator" aria-hidden="true"></span>
        <span id="status-text" role="status" aria-live="polite">Status wird geladen …</span>
        <button class="audio-toggle hidden" id="btn-audio" type="button" aria-pressed="false">
          <svg class="icon" id="audio-icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#volume-xmark"></use></svg>
          <span class="audio-label" id="audio-label">Musik hören</span>
          <span class="audio-tooltip" id="audio-tooltip" role="tooltip"></span>
        </button>
        <span id="status-details" class="status-details"></span>
      </div>

      <div class="buttons" id="main-buttons">
        <button class="action btn-show" id="btn-show" type="button">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#star"></use></svg>
          <span id="btn-show-label">Playlist 1 starten</span>
        </button>
        <button class="action btn-kids" id="btn-kids" type="button">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#child-reaching"></use></svg>
          <span id="btn-kids-label">Playlist 2 starten</span>
        </button>
        <button class="action btn-request" id="btn-request" type="button">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#music"></use></svg>
          <span>Lied wünschen</span>
        </button>
      </div>

      <div class="request-panel hidden" id="request-panel">
        <div class="request-header">
          <h2>Verfügbare Lieder</h2>
          <button class="link-like" id="request-close" type="button">Zurück</button>
        </div>
        <div class="request-list" id="request-list"></div>
      </div>

      <div class="queue" id="queue-section">
        <div class="queue-header">
          <h3>Warteschlange</h3>
          <span id="queue-count" class="queue-count"></span>
        </div>
        <ul class="queue-list" id="queue-list"></ul>
        <p class="note" id="queue-empty">Keine Wünsche in der Warteschlange.</p>
      </div>
      <p class="note" id="note"></p>
      <button class="donate-button" id="btn-donate" type="button">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#gift"></use></svg>
        <span>Spenden</span>
      </button>
    </div>

    <footer class="social-footer hidden" id="social-footer">
      <h3 class="social-footer-title">Unsere Kanäle:</h3>
      <div class="social-icons" id="social-icons"></div>
      <a href="/statistics" class="stats-link"><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#chart-simple"></use></svg> Statistik</a>
    </footer>
  </div>

  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="falconbeat-audio.js"></script>
  <script src="/static/js/index.js"></script>
</body>
</html>
