<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{SITE_NAME}}</title>
  <meta name="description" content="{{SITE_DESCRIPTION}}">
  <meta name="theme-color" content="#170d19">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{SITE_NAME}}">
  <meta property="og:description" content="{{SITE_DESCRIPTION}}">
{{OG_IMAGE}}  <link rel="stylesheet" href="styles.css">
</head>
<body class="festive">
  <div class="scene-decor" aria-hidden="true">
    <div class="tree"></div>
    <div class="ornament ornament-star star-bright"></div>
    <div class="ornament ornament-star star-soft"></div>
    <div class="ornament ornament-star star-twinkle"></div>
    <div class="snowflake snowflake-main"></div>
    <div class="snowflake snowflake-mid"></div>
    <div class="snowflake snowflake-small"></div>
  </div>
  <div class="card">
    <header>
      <h1 id="headline"></h1>
      <details class="site-info" id="site-info">
        <summary>{{t:site.timesAndAddress}}</summary>
        <p class="subtitle" id="subtitle"></p>
      </details>
      <div class="countdown" id="countdown" role="timer" aria-live="off">{{t:countdown.calculating}}</div>
    </header>


    <div id="main-content">
      <p class="quiet-banner hidden" id="preview-banner" role="status"></p>
      <p class="quiet-banner hidden" id="scheduled-show-banner" role="status"></p>
      <p class="quiet-banner hidden" id="show-running-banner" role="status"></p>
      <p class="quiet-banner hidden" id="quiet-banner" role="status"></p>
      <p class="quiet-banner hidden" id="outside-window-banner" role="status"></p>
      <div class="status" id="status">
        <span class="indicator" aria-hidden="true"></span>
        <span id="status-text" role="status" aria-live="polite">{{t:status.loading}}</span>
        <span id="status-details" class="status-details"></span>
      </div>

      <button class="audio-toggle hidden" id="btn-audio" type="button" aria-pressed="false">
        <svg class="icon" id="audio-icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#volume-xmark"></use></svg>
        <span class="audio-label" id="audio-label">{{t:audio.listen}}</span>
        <span class="audio-tooltip" id="audio-tooltip" role="tooltip"></span>
      </button>

      <div class="buttons" id="main-buttons">
{{SHOW_BUTTONS}}
        <button class="action btn-request" id="btn-request" type="button">
          <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#music"></use></svg>
          <span>{{t:button.request}}</span>
        </button>
      </div>

      <div class="request-panel hidden" id="request-panel">
        <div class="request-toolbar">
          <div class="request-header">
            <h2>{{t:request.heading}} <span class="request-count" id="request-count"></span></h2>
            <button class="link-like" id="request-close" type="button">{{t:request.back}}</button>
          </div>
          <input class="request-search" id="request-search" type="search" enterkeyhint="search"
                 autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                 placeholder="{{t:request.searchPlaceholder}}" aria-label="{{t:request.searchLabel}}">
          <div class="request-sort" id="request-sort" role="radiogroup" aria-label="{{t:request.sortLabel}}">
            <button type="button" role="radio" data-sort="az">{{t:request.sortAz}}</button>
            <button type="button" role="radio" data-sort="popular" id="request-sort-popular">{{t:request.sortPopular}}</button>
            <button type="button" role="radio" data-sort="short">{{t:request.sortShort}}</button>
          </div>
        </div>
        <div class="request-list" id="request-list"></div>
      </div>

      <div class="queue" id="queue-section">
        <div class="queue-header">
          <h3>{{t:queue.heading}}</h3>
          <span id="queue-count" class="queue-count"></span>
        </div>
        <ul class="queue-list" id="queue-list"></ul>
        <p class="note" id="queue-empty">{{t:queue.empty}}</p>
      </div>
      <p class="note" id="note"></p>
      <button class="donate-button" id="btn-donate" type="button">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#gift"></use></svg>
        <span>{{t:button.donate}}</span>
      </button>
    </div>

    <footer class="social-footer hidden" id="social-footer">
      <h3 class="social-footer-title">{{t:footer.channels}}</h3>
      <div class="social-icons" id="social-icons"></div>
    </footer>
    <nav class="page-tools" aria-label="{{t:footer.tools}}">
      <a href="/statistics" class="page-tool" title="{{t:footer.statistics}}" aria-label="{{t:footer.statistics}}"><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#chart-simple"></use></svg></a>
      <a class="page-tool hidden" id="language-switch" href="#"><svg class="icon" aria-hidden="true" focusable="false"><use href="/static/icons.svg#language"></use></svg></a>
    </nav>
  </div>

  <!-- Access code: only asked for when an action needs it -->
  <dialog class="access-dialog" id="access-dialog" aria-labelledby="access-title">
    <form method="dialog" class="access-gate" id="access-form">
      <h2 class="access-title" id="access-title">{{t:access.title}}</h2>
      <p class="note" id="access-note">{{t:access.note}}</p>
      <input id="access-input" class="code-input" type="password" placeholder="{{t:access.placeholder}}" aria-label="{{t:access.placeholder}}" autocomplete="off">
      <p class="note" id="access-hint" role="status"></p>
      <p class="note error" id="access-error" role="alert"></p>
      <div class="access-actions">
        <button class="link-like" id="access-cancel" type="button">{{t:access.cancel}}</button>
        <button class="action btn-show" id="access-submit" type="submit">{{t:access.submit}}</button>
      </div>
    </form>
  </dialog>

  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  <script src="{{I18N_SRC}}"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="falconbeat-audio.js"></script>
  <script src="/static/js/index.js"></script>
</body>
</html>
